<h2>竖向色带颜色方案</h2>
<p class="subtitle">三组都保留低透明背景，重点看相邻区间是否容易区分，以及是否会压住曲线。</p>

<div class="cards">
  <div class="card" data-choice="semantic" onclick="toggleSelect(this)">
    <div class="card-image">
      <div style="height:220px;position:relative;border:1px solid #d7dde8;background:#fff;overflow:hidden">
        <div style="position:absolute;inset:0 82% 0 0;background:rgba(185,28,28,.16)"></div>
        <div style="position:absolute;inset:0 64% 0 18%;background:rgba(217,119,6,.18)"></div>
        <div style="position:absolute;inset:0 44% 0 36%;background:rgba(82,82,91,.12)"></div>
        <div style="position:absolute;inset:0 22% 0 56%;background:rgba(22,163,74,.16)"></div>
        <div style="position:absolute;inset:0 0 0 78%;background:rgba(21,128,61,.22)"></div>
        <svg viewBox="0 0 360 220" style="position:absolute;inset:0;width:100%;height:100%">
          <polyline points="14,160 52,130 88,136 126,78 166,98 206,56 246,88 286,132 340,148" fill="none" stroke="#198754" stroke-width="3"/>
          <polyline points="14,150 52,142 88,132 126,118 166,104 206,96 246,104 286,116 340,112" fill="none" stroke="#5470C6" stroke-width="3" opacity=".9"/>
        </svg>
      </div>
    </div>
    <div class="card-body">
      <h3>语义色盘（推荐）</h3>
      <p>清仓红、减仓橙、持有中性灰、加仓绿、重仓深绿。最贴合当前中文标签。</p>
    </div>
  </div>

  <div class="card" data-choice="contrast" onclick="toggleSelect(this)">
    <div class="card-image">
      <div style="height:220px;position:relative;border:1px solid #d7dde8;background:#fff;overflow:hidden">
        <div style="position:absolute;inset:0 82% 0 0;background:rgba(190,24,93,.18)"></div>
        <div style="position:absolute;inset:0 64% 0 18%;background:rgba(234,88,12,.18)"></div>
        <div style="position:absolute;inset:0 44% 0 36%;background:rgba(37,99,235,.12)"></div>
        <div style="position:absolute;inset:0 22% 0 56%;background:rgba(5,150,105,.16)"></div>
        <div style="position:absolute;inset:0 0 0 78%;background:rgba(6,95,70,.24)"></div>
        <svg viewBox="0 0 360 220" style="position:absolute;inset:0;width:100%;height:100%">
          <polyline points="14,160 52,130 88,136 126,78 166,98 206,56 246,88 286,132 340,148" fill="none" stroke="#198754" stroke-width="3"/>
          <polyline points="14,150 52,142 88,132 126,118 166,104 206,96 246,104 286,116 340,112" fill="none" stroke="#5470C6" stroke-width="3" opacity=".9"/>
        </svg>
      </div>
    </div>
    <div class="card-body">
      <h3>高对比色盘</h3>
      <p>持有区改成淡蓝，和橙绿拉开距离。更醒目，但颜色语义稍微多一点。</p>
    </div>
  </div>

  <div class="card" data-choice="colorblind" onclick="toggleSelect(this)">
    <div class="card-image">
      <div style="height:220px;position:relative;border:1px solid #d7dde8;background:#fff;overflow:hidden">
        <div style="position:absolute;inset:0 82% 0 0;background:rgba(120,53,15,.18)"></div>
        <div style="position:absolute;inset:0 64% 0 18%;background:rgba(202,138,4,.20)"></div>
        <div style="position:absolute;inset:0 44% 0 36%;background:rgba(71,85,105,.12)"></div>
        <div style="position:absolute;inset:0 22% 0 56%;background:rgba(14,116,144,.16)"></div>
        <div style="position:absolute;inset:0 0 0 78%;background:rgba(30,64,175,.20)"></div>
        <svg viewBox="0 0 360 220" style="position:absolute;inset:0;width:100%;height:100%">
          <polyline points="14,160 52,130 88,136 126,78 166,98 206,56 246,88 286,132 340,148" fill="none" stroke="#198754" stroke-width="3"/>
          <polyline points="14,150 52,142 88,132 126,118 166,104 206,96 246,104 286,116 340,112" fill="none" stroke="#5470C6" stroke-width="3" opacity=".9"/>
        </svg>
      </div>
    </div>
    <div class="card-body">
      <h3>色弱友好色盘</h3>
      <p>用棕、黄、灰、青、蓝区分风险和机会，辨识度强，但不如红绿直觉。</p>
    </div>
  </div>
</div>
